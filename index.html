<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pass/Fail Checker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex; 
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 350px;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #result {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Pass / Fail Checker</h1>

        <input type="number" id="marksInput" placeholder="Enter your marks">

        <button id="checkButton">Check Result</button>

        <p id="result"></p>
    </div>

    <script>
        document.querySelector("#checkButton").addEventListener("click", function () {

            let marks = document.querySelector("#marksInput").value;
            let result = document.querySelector("#result");

            if (marks === "") {
                result.textContent = "Please enter marks!";
                result.style.color = "orange";
            }
            else if (marks >= 50) {
                result.textContent = "Pass ✅";
                result.style.color = "green";
            }
            else {
                result.textContent = "Fail ❌";
                result.style.color = "red";
            }

        });
    </script>

</body>
